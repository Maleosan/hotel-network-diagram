<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hotel Network Diagram</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<input type="file" id="fileOpen" accept=".json,application/json" hidden>

<div id="toolbar">

    <div class="logo">
        <label for="diagramName" class="srOnly">Diagram name</label>
        <input id="diagramName" value="HOTEL NETWORK DIAGRAM" maxlength="80" aria-label="Diagram name">
    </div>

    <div class="tools">

        <button id="btnOpen">Open</button>

<button id="btnSave">Save</button>

<button id="btnUndo" disabled>Undo</button>

<button id="btnRedo" disabled>Redo</button>

<button id="btnAddDevice">+ Add Device</button>

        <button id="btnAddLink">+ Add Link</button>

        <button id="btnCancelLink" hidden>Cancel Link</button>

<button id="btnExportPNG">Export PNG</button>

        <button id="btnExportSVG">Export SVG</button>

        <button id="btnReset">Reset View</button>

        <button id="btnResetDefault">Reset to Default Diagram</button>

        <button id="btnGrid" class="toggle active">Grid</button>

        <button id="btnSnap" class="toggle active">Snap</button>

        <button id="btnTheme" aria-pressed="false">Dark / Light</button>

    </div>

</div>


<div id="workspace">

    <div id="canvasContainer">

        <svg id="diagram">

            <defs>

                <pattern id="smallGrid"
                    width="20"
                    height="20"
                    patternUnits="userSpaceOnUse">

                    <path
                        d="M20 0 L0 0 0 20"
                        fill="none"
                        stroke="#ffffff"
                        stroke-opacity="0.05"
                        stroke-width="0.6"/>

                </pattern>

                <pattern id="grid"
                    width="100"
                    height="100"
                    patternUnits="userSpaceOnUse">

                    <rect width="100"
                          height="100"
                          fill="url(#smallGrid)"/>

                    <path
                        d="M100 0 L0 0 0 100"
                        fill="none"
                        stroke="#ffffff"
                        stroke-opacity="0.09"
                        stroke-width="0.8"/>

                </pattern>

            </defs>

            <g id="gridLayer">

    <rect
        id="gridBackground"
        x="-10000"
        y="-10000"
        width="20000"
        height="20000"
        fill="url(#grid)"/>

</g>

<g id="viewport">

    <g id="links"></g>

    <g id="nodes"></g>

</g>

        </svg>

    </div>



    <div id="propertyPanel">

        <h2>Properties</h2>

        <div id="nodeProperties">

            <label for="propName">Name</label>

            <input id="propName">

            <label for="propIP">IP Address</label>

            <input id="propIP">

            <label for="propModel">Model</label>

            <input id="propModel">

            <label for="propPortCount">Port Count</label>

            <input id="propPortCount" type="number" min="0" max="512" step="1">

            <label for="propLocation">Location</label>

            <input id="propLocation">

            <label for="propNotes">Notes</label>

            <textarea
                id="propNotes"
                rows="8"></textarea>

            <button id="btnUpdate">

                Update

            </button>

        </div>

        <div id="linkProperties" style="display:none;">

            <label for="propLinkName">Connection</label>

            <input id="propLinkName" readonly>

            <label for="propLinkLabel">Label</label>

            <input id="propLinkLabel" maxlength="80">

            <label for="propLinkRouting">Routing</label>

            <select id="propLinkRouting">
                <option value="straight">Straight</option>
                <option value="custom">Custom / Orthogonal</option>
            </select>

            <div id="routeControls" hidden>
                <button id="btnAddWaypoint" type="button">Add Bend Point</button>
                <button id="btnResetRoute" type="button">Reset Route</button>
                <small>Drag bend points to shape the route. Double-click a segment to add one; select a point and press Delete to remove it.</small>
            </div>

            <label for="propSourcePort">Source Port</label>

            <select id="propSourcePort"></select>

            <label for="propTargetPort">Target Port</label>

            <select id="propTargetPort"></select>

            <label class="checkLabel" for="propLabelFollowsLine">
                <input id="propLabelFollowsLine" type="checkbox" checked>
                Label follows line
            </label>

            <label for="propLinkColor">Color</label>

            <input id="propLinkColor" type="color">

            <label for="propLinkWidth">Width</label>

            <input id="propLinkWidth" type="number" min="1" max="16" step="1">

            <label for="propLinkStyle">Style</label>

            <select id="propLinkStyle">
                <option value="solid">Solid</option>
                <option value="dashed">Dashed</option>
                <option value="dotted">Dotted</option>
            </select>

            <label for="propLinkOpacity">Opacity</label>

            <input id="propLinkOpacity" type="range" min="0.1" max="1" step="0.05">

            <button id="btnDeleteLink">

                Delete Connection

            </button>

        </div>

    </div>

</div>



<div id="statusBar">

    Ready

</div>

<div id="deviceModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="deviceModalTitle">

    <div class="modalContent">

        <h2 id="deviceModalTitle">Add Device</h2>

   <label for="deviceType">Device Type</label>

   <select id="deviceType">

    <option value="router">Router</option>
    <option value="switch">Switch</option>
    <option value="ap">Access Point</option>
    <option value="pc">PC</option>
    <option value="nas">NAS</option>
    <option value="camera">Camera</option>
    <option value="dvr">DVR</option>
    <option value="pabx">PABX</option>
    <option value="cloud">Cloud</option>

</select>
    <label id="lblModel" for="deviceModel" style="display:none;">Model</label>

<select id="deviceModel" style="display:none;">
</select>

<br><br>

<label id="lblPortCount" for="devicePortCount" style="display:none;">Port Count</label>

<select id="devicePortCount" style="display:none;">
</select>

        <br><br>

        <button id="btnCreateDevice">Create</button>

        <button id="btnCloseDevice">Close</button>

    </div>

</div>

<div id="contextMenu" class="contextMenu" role="menu" aria-label="Device actions">

    <div id="cmRename" role="menuitem" tabindex="0">Rename</div>

    <div id="cmDuplicate" role="menuitem" tabindex="0">Duplicate</div>

    <div id="cmDelete" role="menuitem" tabindex="0">Delete</div>

</div>

<script src="app.js"></script>
</body>

</html>
